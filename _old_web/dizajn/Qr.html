<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plaćanje QR kodom</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#16211A}
a{text-decoration:none}
button{font-family:inherit}
</style>
</head>
<body>
<div style="width:820px;height:1360px;box-sizing:border-box;background:#F3F5F0;display:flex;flex-direction:column;overflow:hidden">

  <header style="height:112px;box-sizing:border-box;padding:0 40px;display:flex;align-items:center;justify-content:space-between;flex:none">
    <div style="display:flex;align-items:center;gap:18px">
      <img src="logo.png" alt="Penny" style="width:68px;height:68px;border-radius:18px;display:block;object-fit:cover">
      <div style="font-size:30px;font-weight:800;letter-spacing:-0.3px">Samouslužna kasa</div>
    </div>
    <button type="button" style="height:68px;padding:0 28px;border-radius:34px;border:2px solid #DDE3DA;background:#fff;color:#16211A;font-size:26px;font-weight:700;display:flex;align-items:center;gap:12px">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#16211A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="14" width="5" height="6" rx="2"/><rect x="16.5" y="14" width="5" height="6" rx="2"/></svg>
      Pozovi osoblje
    </button>
  </header>

  <main style="flex:1;min-height:0;padding:20px 40px 0;display:flex;flex-direction:column;align-items:center;gap:28px">

    <div style="text-align:center;display:flex;flex-direction:column;gap:12px;padding:0 20px">
      <h1 style="margin:0;font-size:64px;line-height:1.05;font-weight:800;letter-spacing:-1.2px">Platite QR kodom</h1>
      <p style="margin:0;font-size:30px;line-height:1.35;color:#55625A">Otvorite bankarsku aplikaciju i skenirajte kod.</p>
    </div>

    <div style="width:100%;box-sizing:border-box;background:#fff;border-radius:40px;height:150px;flex:none;padding:0 40px;display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:28px;font-weight:700;color:#55625A">Za platiti</span>
      <span style="font-size:76px;font-weight:800;letter-spacing:-2px">25,37 KM</span>
    </div>

    <div style="flex:1;min-height:0;width:100%;box-sizing:border-box;border-radius:56px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px">
      <div style="position:relative;width:420px;height:420px;box-sizing:border-box;border:4px solid #16211A;border-radius:36px;background:#fff">
        <span style="position:absolute;top:36px;left:36px;width:104px;height:104px;box-sizing:border-box;border:14px solid #16211A;border-radius:12px"></span>
        <span style="position:absolute;top:36px;right:36px;width:104px;height:104px;box-sizing:border-box;border:14px solid #16211A;border-radius:12px"></span>
        <span style="position:absolute;bottom:36px;left:36px;width:104px;height:104px;box-sizing:border-box;border:14px solid #16211A;border-radius:12px"></span>
        <span style="position:absolute;top:172px;left:172px;width:76px;height:76px;background:#16211A;border-radius:10px"></span>
        <span style="position:absolute;bottom:36px;right:36px;width:104px;height:44px;background:#16211A;border-radius:10px"></span>
        <span style="position:absolute;top:36px;left:176px;width:68px;height:40px;background:#16211A;border-radius:10px"></span>
        <div style="position:absolute;bottom:92px;right:36px;font-size:20px;font-weight:700;color:#55625A">mjesto za QR</div>
      </div>
      <div style="display:flex;align-items:center;gap:16px">
        <span style="width:20px;height:20px;border-radius:10px;background:#3C7A1E;box-shadow:0 0 0 8px rgba(60,122,30,0.22)"></span>
        <span style="font-size:30px;font-weight:700">Čekam potvrdu uplate…</span>
      </div>
    </div>

  </main>

  <footer style="flex:none;padding:26px 40px 40px;display:flex;flex-direction:column;gap:14px">
    <a href="Placanje.html" style="height:100px;border-radius:50px;border:3px solid #C3CBC0;background:#fff;color:#16211A;font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center">Odustani i vrati se na izbor</a>
    <a href="Racun.html" style="text-align:center;font-size:22px;font-weight:600;color:#55625A;padding:6px">Prototip: plaćanje je uspjelo →</a>
  </footer>

</div>
</body>
</html>
