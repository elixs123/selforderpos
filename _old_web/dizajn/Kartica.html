<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plaćanje karticom</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#16211A}
a{text-decoration:none}
button{font-family:inherit}
</style>
</head>
<body>
<div style="width:820px;height:1360px;box-sizing:border-box;background:#F3F5F0;display:flex;flex-direction:column;overflow:hidden">

  <header style="height:112px;box-sizing:border-box;padding:0 40px;display:flex;align-items:center;justify-content:space-between;flex:none">
    <div style="display:flex;align-items:center;gap:18px">
      <img src="logo.png" alt="Penny" style="width:68px;height:68px;border-radius:18px;display:block;object-fit:cover">
      <div style="font-size:30px;font-weight:800;letter-spacing:-0.3px">Samouslužna kasa</div>
    </div>
    <button type="button" style="height:68px;padding:0 28px;border-radius:34px;border:2px solid #DDE3DA;background:#fff;color:#16211A;font-size:26px;font-weight:700;display:flex;align-items:center;gap:12px">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#16211A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="14" width="5" height="6" rx="2"/><rect x="16.5" y="14" width="5" height="6" rx="2"/></svg>
      Pozovi osoblje
    </button>
  </header>

  <main style="flex:1;min-height:0;padding:20px 40px 0;display:flex;flex-direction:column;align-items:center;gap:28px">

    <div style="text-align:center;display:flex;flex-direction:column;gap:12px;padding:0 20px">
      <h1 style="margin:0;font-size:64px;line-height:1.05;font-weight:800;letter-spacing:-1.2px">Platite karticom</h1>
      <p style="margin:0;font-size:30px;line-height:1.35;color:#55625A">Prislonite ili ubacite karticu na terminal ispod ekrana.</p>
    </div>

    <div style="width:100%;box-sizing:border-box;background:#fff;border-radius:40px;height:150px;flex:none;padding:0 40px;display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:28px;font-weight:700;color:#55625A">Za platiti</span>
      <span style="font-size:76px;font-weight:800;letter-spacing:-2px">25,37 KM</span>
    </div>

    <div style="flex:1;min-height:0;width:100%;box-sizing:border-box;border-radius:56px;background:#E7F3DD;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px">
      <div style="position:relative;width:340px;height:340px;display:flex;align-items:center;justify-content:center">
        <span style="position:absolute;inset:0;border-radius:170px;border:4px solid rgba(60,122,30,0.18)"></span>
        <span style="position:absolute;inset:36px;border-radius:134px;border:4px solid rgba(60,122,30,0.32)"></span>
        <span style="width:170px;height:170px;border-radius:85px;background:#3C7A1E;display:flex;align-items:center;justify-content:center">
          <svg width="92" height="92" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></svg>
        </span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">
        <div style="font-size:42px;font-weight:800;color:#2C5C14;letter-spacing:-0.5px">Čekam karticu…</div>
        <div style="font-size:26px;font-weight:600;color:#2C5C14">Pratite poruke na terminalu</div>
      </div>
    </div>

  </main>

  <footer style="flex:none;padding:26px 40px 40px;display:flex;flex-direction:column;gap:14px">
    <a href="Placanje.html" style="height:100px;border-radius:50px;border:3px solid #C3CBC0;background:#fff;color:#16211A;font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center">Odustani i vrati se na izbor</a>
    <a href="Racun.html" style="text-align:center;font-size:22px;font-weight:600;color:#55625A;padding:6px">Prototip: plaćanje je uspjelo →</a>
  </footer>

</div>
</body>
</html>
