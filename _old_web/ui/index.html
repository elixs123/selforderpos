<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dobrodošlica</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#16211A}
a{text-decoration:none}
</style>
</head>
<body>
<div style="width:820px;height:1360px;box-sizing:border-box;background:#F3F5F0;display:flex;flex-direction:column;position:relative;overflow:hidden">

  <div style="background:#D5182A;border-radius:0 0 72px 72px;height:700px;box-sizing:border-box;padding:72px 64px 0;display:flex;flex-direction:column;align-items:center;gap:36px;color:#fff;text-align:center">
    <div style="background:#fff;border-radius:56px;padding:14px;width:232px;height:232px;box-sizing:border-box">
      <img src="logo.png" alt="Penny" style="width:204px;height:204px;border-radius:44px;display:block;object-fit:cover">
    </div>
    <h1 style="margin:0;font-size:84px;line-height:1.02;font-weight:800;letter-spacing:-1.5px">Dobrodošli</h1>
    <p style="margin:0;font-size:32px;line-height:1.35;font-weight:500;max-width:560px">Skenirajte artikle, odložite ih i platite. Bez čekanja u redu.</p>
  </div>

  <div style="padding:0 64px;margin-top:-72px;position:relative">
    <a href="Skeniranje.html" style="display:flex;align-items:center;justify-content:center;gap:20px;height:144px;border-radius:72px;background:#3C7A1E;color:#fff;font-size:44px;font-weight:800;box-shadow:0 18px 40px rgba(22,33,26,0.22)">
      Dodirnite za početak
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </div>

  <div style="padding:56px 64px 0;display:flex;flex-direction:column;gap:28px">
    <p style="margin:0;font-size:26px;font-weight:700;color:#55625A;text-align:center;letter-spacing:0.5px">KAKO FUNKCIONIŠE</p>
    <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:24px">
      <div style="background:#fff;border-radius:32px;padding:32px 20px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center">
        <div style="width:96px;height:96px;border-radius:48px;background:#E7F3DD;display:flex;align-items:center;justify-content:center">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#2C5C14" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M8 9v6M12 9v6M16 9v6"/></svg>
        </div>
        <div style="font-size:30px;font-weight:800">1. Skenirajte</div>
        <div style="font-size:24px;line-height:1.35;color:#55625A">Prislonite barkod na skener</div>
      </div>
      <div style="background:#fff;border-radius:32px;padding:32px 20px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center">
        <div style="width:96px;height:96px;border-radius:48px;background:#E7F3DD;display:flex;align-items:center;justify-content:center">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#2C5C14" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
        </div>
        <div style="font-size:30px;font-weight:800">2. Odložite</div>
        <div style="font-size:24px;line-height:1.35;color:#55625A">Stavite artikal na označeno polje</div>
      </div>
      <div style="background:#fff;border-radius:32px;padding:32px 20px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center">
        <div style="width:96px;height:96px;border-radius:48px;background:#E7F3DD;display:flex;align-items:center;justify-content:center">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#2C5C14" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/></svg>
        </div>
        <div style="font-size:30px;font-weight:800">3. Platite</div>
        <div style="font-size:24px;line-height:1.35;color:#55625A">Karticom ili QR kodom</div>
      </div>
    </div>
  </div>

  <div style="margin-top:auto;padding:0 64px 48px;display:flex;align-items:center;justify-content:center;gap:14px;font-size:26px;font-weight:600;color:#55625A">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#55625A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="14" width="5" height="6" rx="2"/><rect x="16.5" y="14" width="5" height="6" rx="2"/></svg>
    Treba vam pomoć? Osoblje je u blizini.
  </div>

</div>
</body>
</html>
