<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odložite artikal</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#16211A}
a{text-decoration:none}
button{font-family:inherit}
</style>
</head>
<body>
<div style="width:820px;height:1360px;box-sizing:border-box;background:#F3F5F0;display:flex;flex-direction:column;overflow:hidden">

  <header style="height:112px;box-sizing:border-box;padding:0 40px;display:flex;align-items:center;justify-content:space-between;flex:none">
    <div style="display:flex;align-items:center;gap:18px">
      <img src="logo.png" alt="Penny" style="width:68px;height:68px;border-radius:18px;display:block;object-fit:cover">
      <div style="font-size:30px;font-weight:800;letter-spacing:-0.3px">Samouslužna kasa</div>
    </div>
    <div style="height:68px;padding:0 26px;border-radius:34px;background:#FFF3D6;color:#8A4B00;font-size:25px;font-weight:800;display:flex;align-items:center;gap:12px">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#8A4B00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      Kasa čeka odlaganje
    </div>
  </header>

  <main style="flex:1;min-height:0;padding:20px 40px 0;display:flex;flex-direction:column;align-items:stretch;gap:22px">

    <div style="text-align:center;display:flex;flex-direction:column;gap:14px;padding:0 20px">
      <h1 style="margin:0;font-size:64px;line-height:1.04;font-weight:800;letter-spacing:-1.2px">Odložite artikal na označeno polje</h1>
      <p style="margin:0;font-size:29px;line-height:1.35;color:#55625A">Kada ga odložite, možete skenirati sljedeći.</p>
    </div>

    <div style="background:#fff;border-radius:36px;padding:0 30px;height:120px;flex:none;display:flex;align-items:center;gap:22px">
      <span style="width:64px;height:64px;border-radius:32px;background:#3C7A1E;display:flex;align-items:center;justify-content:center;flex:none">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </span>
      <div style="flex:1;min-width:0">
        <div style="font-size:23px;font-weight:600;color:#55625A">Upravo skenirano</div>
        <div style="font-size:38px;font-weight:800;letter-spacing:-0.4px">Mlijeko 1 l</div>
      </div>
      <div style="font-size:36px;font-weight:800">1,79 KM</div>
    </div>

    <div style="flex:none;display:flex;justify-content:center;height:72px;align-items:center">
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#3C7A1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M6 14l6 6 6-6"/></svg>
    </div>

    <div style="flex:1;min-height:0;border:6px dashed #3C7A1E;border-radius:60px;background:#E7F3DD;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;box-sizing:border-box">
      <svg width="176" height="176" viewBox="0 0 24 24" fill="none" stroke="#2C5C14" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
      <div style="font-size:44px;font-weight:800;color:#2C5C14;letter-spacing:-0.5px">Polje za odlaganje</div>
      <div style="font-size:27px;font-weight:600;color:#2C5C14">Stavite artikal ovdje</div>
    </div>

    <div style="flex:none;display:flex;align-items:center;justify-content:center;gap:16px;height:64px">
      <span style="width:20px;height:20px;border-radius:10px;background:#3C7A1E;box-shadow:0 0 0 8px rgba(60,122,30,0.22)"></span>
      <span style="font-size:30px;font-weight:700">Čekam da odložite artikal…</span>
    </div>

  </main>

  <footer style="flex:none;padding:12px 40px 40px;display:flex;flex-direction:column;gap:16px">
    <button type="button" style="height:96px;border-radius:48px;border:3px solid #C3CBC0;background:#fff;color:#16211A;font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:14px">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#16211A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="14" width="5" height="6" rx="2"/><rect x="16.5" y="14" width="5" height="6" rx="2"/></svg>
      Odložio sam, a kasa je zaključana
    </button>
    <a href="Skeniranje.html" style="text-align:center;font-size:22px;font-weight:600;color:#55625A;padding:6px">Prototip: simuliraj da je artikal odložen →</a>
  </footer>

</div>
</body>
</html>
