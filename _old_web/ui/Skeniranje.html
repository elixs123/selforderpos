<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skeniranje</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#16211A}
a{text-decoration:none}
button{font-family:inherit}
</style>
</head>
<body>
<div style="width:820px;height:1360px;box-sizing:border-box;background:#F3F5F0;display:flex;flex-direction:column;overflow:hidden">

  <header style="height:112px;box-sizing:border-box;padding:0 40px;display:flex;align-items:center;justify-content:space-between;flex:none">
    <div style="display:flex;align-items:center;gap:18px">
      <img src="logo.png" alt="Penny" style="width:68px;height:68px;border-radius:18px;display:block;object-fit:cover">
      <div style="font-size:30px;font-weight:800;letter-spacing:-0.3px">Samouslužna kasa</div>
    </div>
    <button type="button" style="height:68px;padding:0 28px;border-radius:34px;border:2px solid #DDE3DA;background:#fff;color:#16211A;font-size:26px;font-weight:700;display:flex;align-items:center;gap:12px">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#16211A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="14" width="5" height="6" rx="2"/><rect x="16.5" y="14" width="5" height="6" rx="2"/></svg>
      Pozovi osoblje
    </button>
  </header>

  <nav aria-label="Koraci" style="height:80px;flex:none;display:flex;align-items:center;justify-content:center;gap:18px">
    <div style="display:flex;align-items:center;gap:12px">
      <span style="width:48px;height:48px;border-radius:24px;background:#3C7A1E;color:#fff;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center">1</span>
      <span style="font-size:27px;font-weight:800;color:#16211A">Skeniranje</span>
    </div>
    <span style="width:56px;height:4px;border-radius:2px;background:#DDE3DA"></span>
    <div style="display:flex;align-items:center;gap:12px">
      <span style="width:48px;height:48px;border-radius:24px;border:3px solid #C3CBC0;color:#55625A;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;box-sizing:border-box">2</span>
      <span style="font-size:27px;font-weight:600;color:#55625A">Plaćanje</span>
    </div>
    <span style="width:56px;height:4px;border-radius:2px;background:#DDE3DA"></span>
    <div style="display:flex;align-items:center;gap:12px">
      <span style="width:48px;height:48px;border-radius:24px;border:3px solid #C3CBC0;color:#55625A;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;box-sizing:border-box">3</span>
      <span style="font-size:27px;font-weight:600;color:#55625A">Račun</span>
    </div>
  </nav>

  <main style="flex:1;min-height:0;padding:12px 40px 20px;display:flex;flex-direction:column;gap:18px">

    <section style="background:#fff;border-radius:40px;padding:26px 28px;display:flex;flex-direction:column;gap:20px;flex:none">
      <div style="display:flex;align-items:center;gap:22px">
        <div style="width:84px;height:84px;border-radius:42px;background:#E7F3DD;display:flex;align-items:center;justify-content:center;flex:none">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#2C5C14" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M8 9v6M12 9v6M16 9v6"/></svg>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px">
          <h1 style="margin:0;font-size:42px;line-height:1.1;font-weight:800;letter-spacing:-0.5px">Skenirajte sljedeći artikal</h1>
          <div style="font-size:24px;color:#55625A">Prislonite barkod na skener ispod ekrana</div>
        </div>
      </div>
      <div style="display:flex;gap:14px">
        <input id="barkod" type="text" autofocus aria-label="Upišite šifru ili naziv artikla" placeholder="Ili upišite šifru ili naziv artikla" style="flex:1;min-width:0;height:76px;box-sizing:border-box;border-radius:38px;border:2px solid #C3CBC0;background:#F3F5F0;padding:0 28px;font-family:inherit;font-size:26px;color:#16211A">
      </div>
    </section>

    <a id="zadnje-baner" href="Odlozi.html" style="display:none;flex:none;height:92px;box-sizing:border-box;border-radius:30px;background:#E7F3DD;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;color:#16211A">
      <div style="display:flex;align-items:center;gap:16px;min-width:0">
        <span style="width:48px;height:48px;border-radius:24px;background:#3C7A1E;display:flex;align-items:center;justify-content:center;flex:none">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </span>
        <span style="font-size:27px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Dodano: <span id="zadnje-naziv"></span></span>
      </div>
      <span style="flex:none;height:56px;padding:0 22px;border-radius:28px;background:#FFF3D6;color:#8A4B00;font-size:23px;font-weight:800;display:flex;align-items:center;gap:10px">
        Odložite ga na polje
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A4B00" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </span>
    </a>

    <div style="flex:none;display:flex;align-items:baseline;justify-content:space-between;padding:6px 8px 0">
      <h2 style="margin:0;font-size:32px;font-weight:800">Vaša korpa</h2>
      <span id="broj" style="font-size:25px;font-weight:600;color:#55625A">0 artikala</span>
    </div>

    <section id="stavke" aria-label="Artikli u korpi" style="flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px">
    </section>
  </main>

  <footer style="flex:none;background:#fff;border-radius:48px 48px 0 0;box-shadow:0 -10px 30px rgba(22,33,26,0.08);padding:26px 40px 36px;display:flex;flex-direction:column;gap:22px">
    <div style="display:flex;align-items:baseline;justify-content:space-between">
      <span style="font-size:28px;font-weight:700;color:#55625A">Ukupno za platiti</span>
      <span style="font-size:68px;font-weight:800;letter-spacing:-1.5px"><span data-ukupno>0,00 KM</span></span>
    </div>
    <div style="display:flex;gap:18px">
      <button id="ponisti" type="button" style="width:230px;height:108px;border-radius:54px;border:3px solid #D5182A;background:#fff;color:#B8101F;font-size:28px;font-weight:800">Poništi sve</button>
      <a href="Placanje.html" style="flex:1;height:108px;border-radius:54px;background:#3C7A1E;color:#fff;font-size:44px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:18px">
        Plati
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>
  </footer>

</div>
<script src="app.js"></script>
</body>
</html>
