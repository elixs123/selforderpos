<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Račun</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#16211A}
a{text-decoration:none}
button{font-family:inherit}
</style>
</head>
<body>
<div style="width:820px;height:1360px;box-sizing:border-box;background:#F3F5F0;display:flex;flex-direction:column;overflow:hidden">

  <header style="height:112px;box-sizing:border-box;padding:0 40px;display:flex;align-items:center;justify-content:space-between;flex:none">
    <div style="display:flex;align-items:center;gap:18px">
      <img src="logo.png" alt="Penny" style="width:68px;height:68px;border-radius:18px;display:block;object-fit:cover">
      <div style="font-size:30px;font-weight:800;letter-spacing:-0.3px">Samouslužna kasa</div>
    </div>
  </header>

  <nav aria-label="Koraci" style="height:80px;flex:none;display:flex;align-items:center;justify-content:center;gap:18px">
    <div style="display:flex;align-items:center;gap:12px">
      <span style="width:48px;height:48px;border-radius:24px;background:#E7F3DD;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2C5C14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      <span style="font-size:27px;font-weight:600;color:#55625A">Skeniranje</span>
    </div>
    <span style="width:56px;height:4px;border-radius:2px;background:#3C7A1E"></span>
    <div style="display:flex;align-items:center;gap:12px">
      <span style="width:48px;height:48px;border-radius:24px;background:#E7F3DD;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2C5C14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      <span style="font-size:27px;font-weight:600;color:#55625A">Plaćanje</span>
    </div>
    <span style="width:56px;height:4px;border-radius:2px;background:#3C7A1E"></span>
    <div style="display:flex;align-items:center;gap:12px">
      <span style="width:48px;height:48px;border-radius:24px;background:#3C7A1E;color:#fff;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center">3</span>
      <span style="font-size:27px;font-weight:800">Račun</span>
    </div>
  </nav>

  <main style="flex:1;min-height:0;padding:28px 40px 0;display:flex;flex-direction:column;align-items:center;gap:28px">

    <div style="width:176px;height:176px;border-radius:88px;background:#3C7A1E;display:flex;align-items:center;justify-content:center;flex:none">
      <svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>

    <div style="text-align:center;display:flex;flex-direction:column;gap:10px;padding:0 20px">
      <h1 style="margin:0;font-size:68px;line-height:1.05;font-weight:800;letter-spacing:-1.4px">Plaćanje je uspjelo</h1>
      <p style="margin:0;font-size:32px;line-height:1.35;color:#55625A">Hvala što kupujete u Penny.</p>
    </div>

    <section aria-label="Sažetak računa" style="width:100%;box-sizing:border-box;background:#fff;border-radius:44px;padding:36px 40px;display:flex;flex-direction:column;gap:22px;flex:none">
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <span style="font-size:28px;color:#55625A;font-weight:600">Broj artikala</span>
        <span data-broj-num style="font-size:30px;font-weight:800">0</span>
      </div>
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <span style="font-size:28px;color:#55625A;font-weight:600">Način plaćanja</span>
        <span style="font-size:30px;font-weight:800">Kartica</span>
      </div>
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <span style="font-size:28px;color:#55625A;font-weight:600">Račun br.</span>
        <span style="font-size:30px;font-weight:800">[broj računa]</span>
      </div>
      <div style="height:2px;background:#EDF0EA"></div>
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <span style="font-size:30px;font-weight:700">Plaćeno</span>
        <span style="font-size:68px;font-weight:800;letter-spacing:-1.5px"><span data-ukupno>0,00 KM</span></span>
      </div>
    </section>

    <div style="display:flex;align-items:center;gap:14px;font-size:26px;font-weight:600;color:#55625A">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#55625A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 8V3h10v5M7 17H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-3"/><rect x="7" y="14" width="10" height="7" rx="1"/></svg>
      Račun se štampa ispod ekrana
    </div>

  </main>

  <footer style="flex:none;padding:26px 40px 40px;display:flex;flex-direction:column;gap:16px">
    <a href="index.html" style="height:112px;border-radius:56px;background:#3C7A1E;color:#fff;font-size:44px;font-weight:800;display:flex;align-items:center;justify-content:center">Gotovo</a>
    <div style="text-align:center;font-size:24px;font-weight:600;color:#55625A;padding:4px">Ekran se automatski vraća na početak za 20 s</div>
  </footer>

</div>
<script src="app.js"></script>
</body>
</html>
