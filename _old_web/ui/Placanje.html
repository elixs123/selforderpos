<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Način plaćanja</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#16211A}
a{text-decoration:none}
button{font-family:inherit}
</style>
</head>
<body>
<div style="width:820px;height:1360px;box-sizing:border-box;background:#F3F5F0;display:flex;flex-direction:column;overflow:hidden">

  <header style="height:112px;box-sizing:border-box;padding:0 40px;display:flex;align-items:center;justify-content:space-between;flex:none">
    <a href="Skeniranje.html" style="height:68px;padding:0 28px 0 20px;border-radius:34px;border:2px solid #DDE3DA;background:#fff;color:#16211A;font-size:26px;font-weight:700;display:flex;align-items:center;gap:10px">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#16211A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      Natrag u korpu
    </a>
    <button type="button" style="height:68px;padding:0 28px;border-radius:34px;border:2px solid #DDE3DA;background:#fff;color:#16211A;font-size:26px;font-weight:700;display:flex;align-items:center;gap:12px">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#16211A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="14" width="5" height="6" rx="2"/><rect x="16.5" y="14" width="5" height="6" rx="2"/></svg>
      Pozovi osoblje
    </button>
  </header>

  <nav aria-label="Koraci" style="height:80px;flex:none;display:flex;align-items:center;justify-content:center;gap:18px">
    <div style="display:flex;align-items:center;gap:12px">
      <span style="width:48px;height:48px;border-radius:24px;background:#E7F3DD;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2C5C14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      <span style="font-size:27px;font-weight:600;color:#55625A">Skeniranje</span>
    </div>
    <span style="width:56px;height:4px;border-radius:2px;background:#3C7A1E"></span>
    <div style="display:flex;align-items:center;gap:12px">
      <span style="width:48px;height:48px;border-radius:24px;background:#3C7A1E;color:#fff;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center">2</span>
      <span style="font-size:27px;font-weight:800">Plaćanje</span>
    </div>
    <span style="width:56px;height:4px;border-radius:2px;background:#DDE3DA"></span>
    <div style="display:flex;align-items:center;gap:12px">
      <span style="width:48px;height:48px;border-radius:24px;border:3px solid #C3CBC0;color:#55625A;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;box-sizing:border-box">3</span>
      <span style="font-size:27px;font-weight:600;color:#55625A">Račun</span>
    </div>
  </nav>

  <main style="flex:1;min-height:0;padding:20px 40px 0;display:flex;flex-direction:column;gap:26px">

    <h1 style="margin:0;padding:0 8px;font-size:64px;line-height:1.05;font-weight:800;letter-spacing:-1.2px">Kako želite platiti?</h1>

    <div style="background:#fff;border-radius:40px;height:156px;flex:none;box-sizing:border-box;padding:0 40px;display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:28px;font-weight:700;color:#55625A">Ukupno za platiti</div>
        <div style="font-size:24px;color:#55625A;margin-top:4px"><span data-broj>0 artikala</span> u korpi</div>
      </div>
      <div style="font-size:76px;font-weight:800;letter-spacing:-2px"><span data-ukupno>0,00 KM</span></div>
    </div>

    <a href="Kartica.html" style="flex:1;min-height:0;background:#fff;border-radius:48px;border:4px solid #3C7A1E;padding:0 44px;display:flex;align-items:center;gap:36px;color:#16211A">
      <span style="width:150px;height:150px;border-radius:75px;background:#E7F3DD;display:flex;align-items:center;justify-content:center;flex:none">
        <svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="#2C5C14" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></svg>
      </span>
      <span style="flex:1;display:flex;flex-direction:column;gap:8px">
        <span style="font-size:56px;font-weight:800;letter-spacing:-1px">Kartica</span>
        <span style="font-size:28px;line-height:1.3;color:#55625A">Prislonite ili ubacite karticu na terminal</span>
      </span>
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#3C7A1E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </a>

    <a href="Qr.html" style="flex:1;min-height:0;background:#fff;border-radius:48px;border:4px solid #DDE3DA;padding:0 44px;display:flex;align-items:center;gap:36px;color:#16211A">
      <span style="width:150px;height:150px;border-radius:75px;background:#F3F5F0;display:flex;align-items:center;justify-content:center;flex:none">
        <svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="#16211A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><path d="M14 14h3v3M21 14v.01M14 21h3M21 17v4"/></svg>
      </span>
      <span style="flex:1;display:flex;flex-direction:column;gap:8px">
        <span style="font-size:56px;font-weight:800;letter-spacing:-1px">QR kod</span>
        <span style="font-size:28px;line-height:1.3;color:#55625A">Skenirajte kod mobilnom bankarskom aplikacijom</span>
      </span>
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#55625A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </a>

  </main>

  <footer style="flex:none;padding:26px 40px 44px">
    <a href="Skeniranje.html" style="height:96px;border-radius:48px;border:3px solid #C3CBC0;background:#fff;color:#16211A;font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center">Odustani od plaćanja</a>
  </footer>

</div>
<script src="app.js"></script>
</body>
</html>
